
name: Playwright Tests

on:
  push:
    branches: [main, patch1]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      ACCOUNT1_EMAIL: ${{ secrets.ACCOUNT1_EMAIL }}
      ACCOUNT1_PASSWORD: ${{ secrets.ACCOUNT1_PASSWORD }}
      ACCOUNT2_EMAIL: ${{ secrets.ACCOUNT2_EMAIL }}
      ACCOUNT2_PASSWORD: ${{ secrets.ACCOUNT2_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


